name: PoC Hashtag Research

on:
  workflow_dispatch:
    inputs:
      hashtags:
        description: "カンマ区切りのハッシュタグ(#なし。例: 女子大生,GRWM,美容ルーティン)"
        required: false
        default: ""
      accounts:
        description: "カンマ区切りのInstagramユーザー名(@なし)"
        required: false
        default: ""
  push:
    branches:
      - claude/instagram-analysis-feasibility-llgevb
    paths:
      - "ig-competitor-analysis/research_hashtags.txt"
      - "ig-competitor-analysis/research_accounts.txt"
      - ".github/workflows/poc_research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ig-competitor-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hashtag research PoC
        continue-on-error: true
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_HASHTAGS: ${{ inputs.hashtags || '' }}
        run: |
          if [ -z "$RESEARCH_HASHTAGS" ]; then
            export RESEARCH_HASHTAGS=$(cat research_hashtags.txt | tr -d '\n')
          fi
          python3 src/pipeline/poc_hashtag_research.py

      - name: Run account research PoC
        continue-on-error: true
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_ACCOUNTS: ${{ inputs.accounts || '' }}
        run: |
          if [ -z "$RESEARCH_ACCOUNTS" ]; then
            export RESEARCH_ACCOUNTS=$(cat research_accounts.txt | tr -d '\n')
          fi
          python3 src/pipeline/poc_account_research.py

      - name: Print reports to logs
        run: |
          echo "===== HASHTAG REPORT ====="
          cat reports/poc_research_report.md 2>/dev/null || echo "(no hashtag report)"
          echo "===== ACCOUNT REPORT ====="
          cat reports/poc_account_report.md 2>/dev/null || echo "(no account report)"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc-research-report
          path: |
            ig-competitor-analysis/reports/poc_research_report.md
            ig-competitor-analysis/reports/poc_research_raw.json
            ig-competitor-analysis/reports/poc_account_report.md
            ig-competitor-analysis/reports/poc_account_raw.json
          if-no-files-found: ignore
